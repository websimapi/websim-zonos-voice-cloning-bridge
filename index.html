<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonos Voice Cloning Bridge</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Zonos Local Web UI</h1>
            <p>A simple interface to your local Zonos voice cloning instance.</p>
            <p><strong>Server Status:</strong> <span id="status-light" class="inactive"></span> <span id="status-text">Connecting...</span></p>
        </header>

        <article>
            <form id="tts-form">
                <div class="grid">
                    <label for="audio-file">
                        Reference Audio (10-30s WAV/MP3)
                        <input type="file" id="audio-file" name="audioReference" accept="audio/wav, audio/mpeg" required>
                    </label>
                    <label for="language">
                        Language
                        <select id="language" name="language" required>
                            <option value="en" selected>English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                            <option value="pt">Portuguese</option>
                            <option value="pl">Polish</option>
                            <option value="tr">Turkish</option>
                            <option value="ru">Russian</option>
                            <option value="nl">Dutch</option>
                            <option value="cs">Czech</option>
                            <option value="ar">Arabic</option>
                            <option value="zh-cn">Chinese (Simplified)</option>
                            <option value="ja">Japanese</option>
                            <option value="ko">Korean</option>
                        </select>
                    </label>
                </div>

                <label for="text">Text to Synthesize</label>
                <textarea id="text" name="text" rows="5" placeholder="Enter the text you want to hear in the cloned voice..." required></textarea>

                <fieldset>
                    <legend>Advanced Controls</legend>
                    <div class="grid">
                        <label for="speed">
                            Speed: <span id="speed-value">1.0</span>
                            <input type="range" id="speed" name="speed" min="0.5" max="2.0" step="0.1" value="1.0">
                        </label>
                         <label for="temperature">
                            Creativity (Temperature): <span id="temperature-value">0.7</span>
                            <input type="range" id="temperature" name="temperature" min="0.1" max="1.0" step="0.05" value="0.7">
                        </label>
                    </div>
                </fieldset>
                
                <button type="submit" id="generate-btn">Generate</button>
            </form>
        </article>

        <article id="output-section" hidden>
            <h2>Generated Audio</h2>
            <audio id="audio-output" controls></audio>
        </article>
        
        <div id="loading-overlay" hidden>
            <div class="loading-spinner" aria-busy="true"></div>
            <p>Generating... please wait.</p>
        </div>

    </main>

    <footer class="container">
        <a href="/download-zip" role="button" class="secondary">Download Project ZIP</a>
    </footer>

    <script src="script.js"></script>

</body>
</html>
